packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - i18next@26.7.1
  - react-i18next@17.1.11
allowBuilds:
  sharp: true
  better-sqlite3: false
  # Squirrel installer support that electron-builder pulls in; HOLO uses NSIS (WP 5.5).
  electron-winstaller: false
patchedDependencies:
  '@cesium/engine@26.4.0': patches/@cesium__engine@26.4.0.patch
