# Installed by install.sh only when CONVERT_SANDBOX=podman (docs/SECURITY.md).
# Rootless podman makes a user, mount, network, PID, IPC and UTS namespace for each conversion
# step's container, so the server may create namespaces. The steps themselves run with no network,
# no capabilities and a read-only root (apps/server/src/sandbox.ts).
[Service]
RestrictNamespaces=no
