# WP 0.1: type-check, unit tests and build on every push and pull request.
# The internal CI runs the same steps against the offline package mirror.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm -r --if-present run typecheck
      - name: No hard-coded interface strings
        run: node scripts/check-i18n.cjs
      - name: Third-party licences allowed and listed
        run: node scripts/licenses.cjs --check
      - name: Unit tests
        run: pnpm -r --if-present run test
      - name: Build
        run: pnpm -r --if-present run build

  # WP 5.5: the Windows installer, built, checked and installed on Windows on every pull request.
  # It is signed when the repository has the organisation's certificate (secrets WIN_CSC_LINK and
  # WIN_CSC_KEY_PASSWORD), and kept for 14 days as a download to try on a workstation.
  desktop-installer:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      VIEWER_VERSION: 0.5.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Desktop unit tests on Windows, with the real FBX converter (WP 5.2)
        run: pnpm --filter @viewer/desktop test
      - name: Build the web app and the desktop app
        run: |
          pnpm --filter @viewer/web build
          pnpm --filter @viewer/desktop build
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-win-${{ hashFiles('apps/desktop/package.json') }}
      - name: Installer
        run: pnpm --filter @viewer/desktop dist
      - name: Electron fuses
        run: node scripts/check-fuses.cjs apps/desktop/release/win-unpacked/VIEWER.exe
      - name: Install for this user, start, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem apps/desktop/release -Filter "VIEWER-Setup-*.exe").FullName
          if ($env:CSC_LINK) { ./scripts/check-installer.ps1 -Installer $setup -RequireSignature } else { ./scripts/check-installer.ps1 -Installer $setup }
      - uses: actions/upload-artifact@v4
        with:
          name: VIEWER-Setup-windows
          path: apps/desktop/release/VIEWER-Setup-*.exe
          retention-days: 14

  # WP 3.1: the server tests again against a real PostgreSQL (unit tests use embedded PGlite).
  server-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: viewer
          POSTGRES_DB: viewer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The backup test runs pg_dump, which must be the server's major version or newer.
      - name: PostgreSQL 17 client
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Server tests on PostgreSQL
        run: pnpm --filter @viewer/server test
        env:
          TEST_DATABASE_URL: postgres://postgres:viewer@localhost:5432/viewer

  # WP 5.6: the offline server bundle, built and installed on a clean machine with systemd as
  # docs/INSTALL.md says: HTTPS with a certificate from a test CA, the admin, a base map package,
  # the nightly backup, an upgrade, a version that fails to start, and a rollback. The bundle is
  # kept for 14 days as a download.
  server-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: viewer
          POSTGRES_PASSWORD: viewer-db-pw
          POSTGRES_DB: viewer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U viewer" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r --if-present run build
      - name: Two bundles, the second a later version
        run: |
          VIEWER_VERSION=0.6.${{ github.run_number }} bash scripts/build-server-bundle.sh
          VIEWER_VERSION=0.6.${{ github.run_number }}-next bash scripts/build-server-bundle.sh
      # The nightly backup runs pg_dump, which must be the database's major version or newer.
      - name: PostgreSQL 17 client
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Install, upgrade, fail, roll back
        run: |
          sudo PATH="$PATH" bash scripts/check-server-install.sh \
            out/viewer-server-0.6.${{ github.run_number }}-linux-x64.tar.gz \
            out/viewer-server-0.6.${{ github.run_number }}-next-linux-x64.tar.gz \
            postgres://viewer:viewer-db-pw@127.0.0.1:5432/viewer
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-server-linux-x64
          path: |
            out/viewer-server-0.6.${{ github.run_number }}-linux-x64.tar.gz
            out/viewer-server-0.6.${{ github.run_number }}-linux-x64.tar.gz.sha256
          retention-days: 14
          compression-level: 0

  # Production gap 7: the browser acceptance checks run on every pull request, in software
  # rendering (SwiftShader), on the light sample set (Khronos models and CesiumGS tilesets).
  # Software rendering is slow and runners vary (one check took 12 to 25 minutes), so the checks
  # run as four jobs side by side, each well inside its limit.
  browser:
    name: browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [shell, layers, tools, accuracy, a11y, outbound]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: apps/web/public/samples
          key: samples-light-${{ hashFiles('scripts/fetch-samples.sh') }}
      - name: Sample models
        run: test -f apps/web/public/samples/khronos/ABeautifulGame.glb || LIGHT=1 bash scripts/fetch-samples.sh
      - name: Build
        run: pnpm -r --if-present run build
      - name: Start the web app
        run: |
          (cd apps/web && nohup npx vite preview --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:4173/ > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/preview.log"; exit 1
      - name: Shell in both languages and themes, with accessibility (AC WP 1.8)
        if: matrix.suite == 'shell'
        run: node scripts/check-shell.cjs check-out/shell
        env:
          SHELL_MODEL: SciFi Helmet
      - name: Versions, details edited in the viewer, and share links with their version and measurements (WP 4.4, 4.6)
        if: matrix.suite == 'shell'
        run: node scripts/check-versions.cjs
      - name: Every screen by keyboard and screen reader, in both languages and themes, against the server (WP 6.2, NFR-17, NFR-16)
        if: matrix.suite == 'a11y'
        run: node scripts/check-a11y.cjs check-out/a11y
      - name: Zero outbound connections in a full session, by packet capture in an isolated network (AC-10, NFR-12)
        if: matrix.suite == 'outbound'
        run: |
          sudo apt-get install -y -q tcpdump > /dev/null
          sudo -E env PATH="$PATH" bash scripts/check-outbound.sh check-out/outbound
      - name: Layers (AC-05)
        if: matrix.suite == 'layers'
        run: node scripts/check-layers.cjs
      - name: Layer editor, saved for everyone and carried to the next version, and the upload wizard's standard names (WP 4.3)
        if: matrix.suite == 'layers'
        run: node scripts/check-layer-editor.cjs
      - name: A fault in one part keeps the rest working
        if: matrix.suite == 'tools'
        run: node scripts/check-faults.cjs
      - name: Snapping to corners and edges within 10 px (MSR-03)
        if: matrix.suite == 'tools'
        run: node scripts/check-snap.cjs
      - name: Measuring on the model's own surface, in its own units, the measurement panel and coordinates (WP 2.4, 2.5, 2.6)
        if: matrix.suite == 'tools'
        run: node scripts/check-measure.cjs
      - name: LOD inspector against Cesium's statistics, live detail, colour by depth, freeze (WP 2.10, LOD-01)
        if: matrix.suite == 'tools'
        run: node scripts/check-lod.cjs
      # The Electron download from GitHub releases sometimes answers 504: keep it in the cache and retry.
      - uses: actions/cache@v4
        if: matrix.suite == 'accuracy'
        with:
          path: ~/.cache/electron
          key: electron-${{ hashFiles('apps/desktop/package.json') }}
      - name: Electron for the desktop app
        if: matrix.suite == 'accuracy'
        run: |
          install="$(dirname "$(node -p "require.resolve('electron/package.json', { paths: ['apps/desktop'] })")")/install.js"
          for i in 1 2 3 4; do node "$install" && exit 0; sleep $((i * 15)); done
          exit 1
      - name: Measurements against survey data, in the web app and the desktop app (WP 2.7, NFR-07, NFR-18)
        if: matrix.suite == 'accuracy'
        run: xvfb-run -a node scripts/check-accuracy.cjs
      - name: Desktop app with the library server, online and offline, and local files read in place (WP 5.1, 5.3, 5.4)
        if: matrix.suite == 'accuracy'
        run: xvfb-run -a node scripts/check-desktop.cjs
      - name: Line of sight against a GDAL reference on a DEM, and the analysis panel (WP 2.8, ANL-01, ANL-02)
        if: matrix.suite == 'accuracy'
        run: node scripts/check-sight.cjs
      - name: 360° visibility against gdal_viewshed on a DEM, the visible area and its GeoTIFF (WP 2.9, ANL-03)
        if: matrix.suite == 'accuracy'
        run: node scripts/check-viewshed.cjs
      - name: Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-screenshots-${{ matrix.suite }}
          path: check-out/
          if-no-files-found: ignore
